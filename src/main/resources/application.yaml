spring:
  application:
    name: job-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/job_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

logging:
  level:
    org:
      springframework:
        security: TRACE